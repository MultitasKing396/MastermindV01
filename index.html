<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mastermind NFC Mini Game</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; user-select: none; }
  body { display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .head { font-size: 13px; letter-spacing: 1px; margin-bottom: 6px; color: #ccc; }
  .head b { color: #00e5ff; font-size: 15px; }
  .bar { width: 292px; margin: 0 auto 8px; display: flex; justify-content: space-between; align-items: center; }
  .reset { height: 32px; line-height: 32px; padding: 0 12px; font-size: 12px; background: #333; color: #fff; border-radius: 6px; cursor: pointer; }
  .secret-bar { display: flex; gap: 6px; align-items: center; }
  .s-dot { width: 22px; height: 22px; border-radius: 50%; background: #222; border: 1px solid #555; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #888; font-weight: bold; }
  .wrap { position: relative; width: 292px; height: 356px; margin: 0 auto 8px; background: #000; border: 2px solid #555; padding: 5px; display: flex; flex-direction: column-reverse; justify-content: space-between; }
  .row { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; border-radius: 5px; background: #141414; border: 1px solid #222; }
  .row.active { border-color: #00e5ff; background: #1a2226; }
  .pegs { display: flex; gap: 10px; }
  .peg { width: 20px; height: 20px; border-radius: 50%; background: #222; border: 1px solid #444; }
  .hints { display: grid; grid-template-columns: repeat(2, 9px); grid-template-rows: repeat(2, 9px); gap: 3px; }
  .h-dot { width: 9px; height: 9px; border-radius: 50%; background: #2a2a2a; }
  .h-dot.exact { background: #00ff00; }
  .h-dot.near { background: #ffee00; }
  .ov { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; cursor: pointer; padding: 12px; }
  .ov.show { display: flex; }
  .ov h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 1px; }
  .ov p { margin: 4px 0; font-size: 14px; color: #fff; }
  .ov .sub { margin-top: 14px; font-size: 11px; color: #777; }
  .controls { width: 292px; display: flex; flex-direction: column; gap: 8px; }
  .colors { display: flex; justify-content: space-between; }
  .c-btn { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); cursor: pointer; }
  .c-btn:active { transform: scale(0.9); }
  .actions { display: flex; gap: 8px; }
  .act-btn { flex: 1; height: 38px; line-height: 36px; font-size: 14px; font-weight: bold; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; }
  .act-btn:active { background: #444; }
  .act-btn.ok { border-color: #00ff00; color: #00ff00; }
  .act-btn.del { border-color: #ff3b30; color: #ff3b30; }
  .info { font-size: 11px; color: #888; margin-top: 7px; }
</style>
</head>
<body>
  <div class="head">MASTERMIND NFC MINI GAME<br>VERSUCH <b id="turn">1</b> / 10</div>
  <div class="bar">
    <div class="reset" data-act="init">Neu starten</div>
    <div class="secret-bar"><div class="s-dot" id="s0">?</div><div class="s-dot" id="s1">?</div><div class="s-dot" id="s2">?</div><div class="s-dot" id="s3">?</div></div>
  </div>
  <div class="wrap" id="board">
    <div id="ov" class="ov" data-act="init"><h2 id="ovT">GEKNACKT!</h2><p id="ov1"></p><p id="ov2"></p><div class="sub">Tippen für neuen Code</div></div>
  </div>
  <div class="controls">
    <div class="colors">
      <div class="c-btn" style="background:#ff3b30" data-col="0"></div>
      <div class="c-btn" style="background:#00ff00" data-col="1"></div>
      <div class="c-btn" style="background:#3388ff" data-col="2"></div>
      <div class="c-btn" style="background:#ffee00" data-col="3"></div>
      <div class="c-btn" style="background:#cc33ff" data-col="4"></div>
      <div class="c-btn" style="background:#ff7700" data-col="5"></div>
    </div>
    <div class="actions">
      <div class="act-btn del" data-act="back">⌫ Löschen</div>
      <div class="act-btn ok" data-act="check">✓ Prüfen</div>
    </div>
  </div>
  <div class="info">by Alp</div>
<script>
const board = document.getElementById("board");
const ov = document.getElementById("ov");
for (let r = 0; r < 10; r++) {
  const row = document.createElement("div");
  row.id = "r" + r;
  row.className = "row";
  row.innerHTML = '<div class="pegs"><div class="peg" id="p'+r+'_0"></div><div class="peg" id="p'+r+'_1"></div><div class="peg" id="p'+r+'_2"></div><div class="peg" id="p'+r+'_3"></div></div><div class="hints"><div class="h-dot" id="h'+r+'_0"></div><div class="h-dot" id="h'+r+'_1"></div><div class="h-dot" id="h'+r+'_2"></div><div class="h-dot" id="h'+r+'_3"></div></div>';
  board.insertBefore(row, ov);
}
let secret = "", step = 0, cur = "", over = false, best = Number(localStorage.getItem("mm_nfc_best")) || 0;
function col(i) { return i===0?"#ff3b30":i===1?"#00ff00":i===2?"#3388ff":i===3?"#ffee00":i===4?"#cc33ff":"#ff7700"; }
function paintRow(r, str) {
  for (let c = 0; c < 4; c++) {
    const p = document.getElementById("p" + r + "_" + c);
    p.style.background = c < str.length ? col(Number(str.charAt(c))) : "#222";
    p.style.borderColor = c < str.length ? "#fff" : "#444";
  }
}
function revealSecret(show) {
  for (let i = 0; i < 4; i++) {
    const s = document.getElementById("s" + i);
    s.textContent = show ? "" : "?";
    s.style.background = show ? col(Number(secret.charAt(i))) : "#222";
    s.style.borderColor = show ? "#fff" : "#555";
  }
}
function pick(i) { if (!over && cur.length < 4) { cur += String(i); paintRow(step, cur); } }
function back() { if (!over && cur.length > 0) { cur = cur.slice(0, -1); paintRow(step, cur); } }
function check() {
  if (over || cur.length < 4) return;
  let exact = 0, near = 0, sUsed = "", gUsed = "";
  for (let i = 0; i < 4; i++) {
    if (cur.charAt(i) === secret.charAt(i)) { exact++; sUsed += "1"; gUsed += "1"; } else { sUsed += "0"; gUsed += "0"; }
  }
  for (let i = 0; i < 4; i++) {
    if (gUsed.charAt(i) === "1") continue;
    for (let j = 0; j < 4; j++) {
      if (sUsed.charAt(j) === "0" && cur.charAt(i) === secret.charAt(j)) { near++; sUsed = sUsed.slice(0, j) + "1" + sUsed.slice(j + 1); break; }
    }
  }
  let hStr = ("2".repeat(exact) + "1".repeat(near) + "0000").slice(0, 4);
  for (let h = 0; h < 4; h++) {
    const code = hStr.charAt(h);
    document.getElementById("h" + step + "_" + h).className = "h-dot" + (code === "2" ? " exact" : (code === "1" ? " near" : ""));
  }
  document.getElementById("r" + step).classList.remove("active");
  step++; cur = "";
  if (exact === 4) {
    over = true; revealSecret(true);
    if (best === 0 || step < best) { best = step; localStorage.setItem("mm_nfc_best", best); }
    ovT.textContent = "CODE GEKNACKT!"; ovT.style.color = "#00ff00";
    ov1.textContent = "Versuche: " + step + " / 10";
    ov2.textContent = "Rekord: " + best + (best === 1 ? " Versuch" : " Versuche");
    ov.classList.add("show"); return;
  }
  if (step >= 10) {
    over = true; revealSecret(true);
    ovT.textContent = "NICHT GEKNACKT"; ovT.style.color = "#ff3b30";
    ov1.textContent = "Oben siehst du den Geheimcode";
    ov2.textContent = best > 0 ? "Rekord: " + best + (best === 1 ? " Versuch" : " Versuche") : "";
    ov.classList.add("show"); return;
  }
  document.getElementById("r" + step).classList.add("active");
  turn.textContent = step + 1;
}
function init() {
  secret = ""; let pool = "012345";
  for (let i = 0; i < 4; i++) { const r = Math.floor(Math.random() * pool.length); secret += pool.charAt(r); pool = pool.slice(0, r) + pool.slice(r + 1); }
  step = 0; cur = ""; over = false; turn.textContent = "1"; ov.classList.remove("show"); revealSecret(false);
  for (let r = 0; r < 10; r++) {
    document.getElementById("r" + r).className = "row" + (r === 0 ? " active" : "");
    paintRow(r, "");
    for (let h = 0; h < 4; h++) document.getElementById("h" + r + "_" + h).className = "h-dot";
  }
}
function handleTap(e) {
  const cBtn = e.target.closest("[data-col]");
  if (cBtn) { e.preventDefault(); pick(Number(cBtn.getAttribute("data-col"))); return; }
  const aBtn = e.target.closest("[data-act]");
  if (aBtn) {
    e.preventDefault();
    const act = aBtn.getAttribute("data-act");
    if (act === "init") init();
    if (act === "back") back();
    if (act === "check") check();
  }
}
document.addEventListener("touchend", handleTap, {passive: false});
document.addEventListener("click", handleTap);
document.addEventListener("touchmove", e => e.preventDefault(), {passive: false});
init();
</script>
</body>
</html>
