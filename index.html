<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mastermind NFC Mini Game</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .head { font-size: 13px; letter-spacing: 1px; margin-bottom: 6px; color: #ccc; }
  .head b { color: #00e5ff; font-size: 15px; }
  .bar { width: 280px; margin: 0 auto 8px; display: flex; justify-content: space-between; align-items: center; }
  .reset { height: 32px; padding: 0 12px; font-size: 12px; background: #333; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .reset:active { background: #555; }
  .secret-bar { display: flex; gap: 6px; align-items: center; }
  .s-dot { width: 22px; height: 22px; border-radius: 50%; background: #222; border: 1px solid #555; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #888; font-weight: bold; }
  .wrap { position: relative; width: 280px; height: 336px; margin: 0 auto 10px; background: #000; border: 2px solid #555; padding: 6px; display: flex; flex-direction: column-reverse; justify-content: space-between; }
  .row { display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; background: #141414; border: 1px solid #222; }
  .row.active { border-color: #00e5ff; background: #1a2226; }
  .pegs { display: flex; gap: 10px; }
  .peg { width: 24px; height: 24px; border-radius: 50%; background: #222; border: 1px solid #444; }
  .hints { display: grid; grid-template-columns: repeat(2, 10px); grid-template-rows: repeat(2, 10px); gap: 3px; }
  .h-dot { width: 10px; height: 10px; border-radius: 50%; background: #2a2a2a; }
  .h-dot.exact { background: #00ff00; }
  .h-dot.near { background: #ffee00; }
  .ov {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 50;
    cursor: pointer;
    padding: 12px;
  }
  .ov.show { display: flex; }
  .ov h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 1px; }
  .ov p { margin: 4px 0; font-size: 14px; color: #fff; }
  .ov .sub { margin-top: 14px; font-size: 11px; color: #777; }
  .controls { width: 280px; display: flex; flex-direction: column; gap: 8px; }
  .colors { display: flex; justify-content: space-between; }
  .c-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); cursor: pointer; }
  .c-btn:active { transform: scale(0.92); }
  .actions { display: flex; gap: 8px; }
  .act-btn { flex: 1; height: 38px; font-size: 15px; font-weight: bold; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; }
  .act-btn:active { background: #444; }
  .act-btn.ok { border-color: #00ff00; color: #00ff00; }
  .act-btn.del { border-color: #ff3b30; color: #ff3b30; }
  .info { font-size: 11px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
  <div class="head">MASTERMIND NFC MINI GAME<br>VERSUCH <b id="turn">1</b> / 8</div>
  <div class="bar">
    <button type="button" class="reset" onclick="init()">Neu starten</button>
    <div class="secret-bar" id="secBar">
      <div class="s-dot">?</div>
      <div class="s-dot">?</div>
      <div class="s-dot">?</div>
      <div class="s-dot">?</div>
    </div>
  </div>
  <div class="wrap">
    <div id="board"></div>
    <div id="ov" class="ov" onclick="init()">
      <h2 id="ovT">GEKNACKT!</h2>
      <p id="ov1"></p>
      <p id="ov2"></p>
      <div class="sub">Tippen für neuen Code</div>
    </div>
  </div>
  <div class="controls">
    <div class="colors" id="pal"></div>
    <div class="actions">
      <button type="button" class="act-btn del" onclick="back()">⌫ Löschen</button>
      <button type="button" class="act-btn ok" onclick="check()">✓ Prüfen</button>
    </div>
  </div>
  <div class="info">by Alp</div>

<script>
const palette = Array.of("#ff3b30", "#00ff00", "#3388ff", "#ffee00", "#cc33ff", "#ff7700");
const boardEl = document.getElementById("board");
const palEl = document.getElementById("pal");
const turnEl = document.getElementById("turn");
const secBarEl = document.getElementById("secBar");
const ovEl = document.getElementById("ov");
const ovT = document.getElementById("ovT");
const ov1 = document.getElementById("ov1");
const ov2 = document.getElementById("ov2");

let secret = "";
let guesses = Array.of();
let hints = Array.of();
let current = "";
let over = false;
let best = Number(localStorage.getItem("mastermind_nfc_best")) || 0;

function buildPalette() {
  palEl.innerHTML = "";
  for (let i = 0; i < 6; i++) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "c-btn";
    btn.style.background = palette.slice(i, i + 1).pop();
    btn.setAttribute("onclick", "pick(" + i + ")");
    palEl.appendChild(btn);
  }
}

function renderSecret(reveal) {
  secBarEl.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const d = document.createElement("div");
    d.className = "s-dot";
    if (reveal) {
      const idx = Number(secret.charAt(i));
      d.style.background = palette.slice(idx, idx + 1).pop();
      d.style.borderColor = "#fff";
    } else {
      d.textContent = "?";
    }
    secBarEl.appendChild(d);
  }
}

function renderBoard() {
  boardEl.innerHTML = "";
  boardEl.style.display = "flex";
  boardEl.style.flexDirection = "column-reverse";
  boardEl.style.gap = "4px";
  for (let r = 0; r < 8; r++) {
    const row = document.createElement("div");
    const isActive = !over && r === guesses.length;
    row.className = "row" + (isActive ? " active" : "");

    const pegs = document.createElement("div");
    pegs.className = "pegs";
    const rowStr = r < guesses.length ? guesses.slice(r, r + 1).pop() : (isActive ? current : "");
    for (let c = 0; c < 4; c++) {
      const peg = document.createElement("div");
      peg.className = "peg";
      if (c < rowStr.length) {
        const colIdx = Number(rowStr.charAt(c));
        peg.style.background = palette.slice(colIdx, colIdx + 1).pop();
        peg.style.borderColor = "#fff";
      }
      pegs.appendChild(peg);
    }

    const hintBox = document.createElement("div");
    hintBox.className = "hints";
    const hStr = r < hints.length ? hints.slice(r, r + 1).pop() : "0000";
    for (let h = 0; h < 4; h++) {
      const hd = document.createElement("div");
      const code = hStr.charAt(h);
      hd.className = "h-dot" + (code === "2" ? " exact" : (code === "1" ? " near" : ""));
      hintBox.appendChild(hd);
    }

    row.appendChild(pegs);
    row.appendChild(hintBox);
    boardEl.appendChild(row);
  }
}

function pick(idx) {
  if (over || current.length >= 4) return;
  current += String(idx);
  renderBoard();
}

function back() {
  if (over || current.length === 0) return;
  current = current.slice(0, current.length - 1);
  renderBoard();
}

function check() {
  if (over || current.length < 4) return;
  let exact = 0;
  let near = 0;
  let sUsed = "";
  let gUsed = "";

  for (let i = 0; i < 4; i++) {
    if (current.charAt(i) === secret.charAt(i)) {
      exact++;
      sUsed += "1";
      gUsed += "1";
    } else {
      sUsed += "0";
      gUsed += "0";
    }
  }

  for (let i = 0; i < 4; i++) {
    if (gUsed.charAt(i) === "1") continue;
    for (let j = 0; j < 4; j++) {
      if (sUsed.charAt(j) === "0" && current.charAt(i) === secret.charAt(j)) {
        near++;
        sUsed = sUsed.slice(0, j) + "1" + sUsed.slice(j + 1);
        break;
      }
    }
  }

  let hStr = "2".repeat(exact) + "1".repeat(near);
  while (hStr.length < 4) hStr += "0";

  guesses.push(current);
  hints.push(hStr);
  current = "";

  if (exact === 4) {
    over = true;
    renderSecret(true);
    renderBoard();
    const tries = guesses.length;
    if (best === 0 || tries < best) {
      best = tries;
      localStorage.setItem("mastermind_nfc_best", best);
    }
    ovT.textContent = "CODE GEKNACKT!";
    ovT.style.color = "#00ff00";
    ov1.textContent = "Benötigte Versuche: " + tries + " / 8";
    ov2.textContent = "Rekord: " + best + (best === 1 ? " Versuch" : " Versuche");
    ovEl.classList.add("show");
    return;
  }

  if (guesses.length >= 8) {
    over = true;
    renderSecret(true);
    renderBoard();
    ovT.textContent = "NICHT GEKNACKT";
    ovT.style.color = "#ff3b30";
    ov1.textContent = "Oben siehst du den geheimen Code";
    ov2.textContent = best > 0 ? "Dein Rekord: " + best + (best === 1 ? " Versuch" : " Versuche") : "";
    ovEl.classList.add("show");
    return;
  }

  turnEl.textContent = guesses.length + 1;
  renderBoard();
}

function init() {
  secret = "";
  for (let i = 0; i < 4; i++) {
    secret += String(Math.floor(Math.random() * 6));
  }
  guesses = Array.of();
  hints = Array.of();
  current = "";
  over = false;
  turnEl.textContent = "1";
  ovEl.classList.remove("show");
  renderSecret(false);
  renderBoard();
}

document.addEventListener("touchmove", e => e.preventDefault(), {passive: false});
buildPalette();
init();
</script>
</body>
</html>
